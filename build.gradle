plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.JavaSpring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // 1. Core & Web (Controle de requisições HTTP e REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web' // CORRIGIDO: O nome oficial é apenas '-web'

    // 2. Banco de Dados & Persistência (JPA / Hibernate e Driver PostgreSQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 3. Segurança & Autenticação (Spring Security e Tokens JWT)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 4. Produtividade (Lombok para gerar Getters, Setters, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 5. Ambiente de Testes (Spring Boot Test e Security Test)
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // CORRIGIDO: Este starter já engloba testes Web e JPA juntos
    testImplementation 'org.springframework.security:spring-security-test' // CORRIGIDO: Nome oficial para testes de segurança
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
